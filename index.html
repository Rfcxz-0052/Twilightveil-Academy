<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暮影學院</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="./public/favicon.ico">

    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png">

    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">

    <link rel="manifest" href="./public/site.webmanifest">
</head>

<body id="gameBody" data-ui="home">

    <!-- 🔵 首頁 UI -->
    <div id="homeUI">
        <h1>歡迎來到暮影學院!</h1>
        <h3>光與影的交際處</h3>
        <button id="startBtn">進入遊戲</button>
    </div>

    <!-- 🎮 遊戲 UI -->
    <div id="gameUI">
        <!-- 故事區塊 -->
        <div class="story-container">
            <div class="character-layer">
                <div id="playerImg" class="character player">
                    <img src="" />
                </div>

                <div id="characterImg" class="character npc">
                    <img src="" />
                </div>
            </div>
            <div class="middle-area">
                <div id="dialogBox" class="dialog-box">
                    <div id="storyText" class="story"></div>
                    <div class="choice-area">
                        <div id="choiceButtons" class="center-buttons"></div>
                    </div>
                    <button id="continueBtn">▼ 點擊繼續</button>
                </div>
            </div>
        </div>
    </div>

        <!-- 側邊欄 -->
        <div id="sidebarWrapper" class="sidebar-wrapper">
            <div id="sidebar" class="sidebar">
                <button id="toggleSidebar" class="sidebar-toggle">☰</button>
                <div class="panel-section">
                    <h3>聲音設定</h3>
                    <label>音樂
                    <input type="range" min="0" max="1" step="0.01" id="bgmSlider">
                    </label><br>
                    <label>音效
                    <input type="range" min="0" max="1" step="0.01" id="seSlider">
                    </label><br>
                </div>
                <div id="affectionDisplay"></div>
                <div id="lightShadowDisplay"></div>
                <div class="panel-save">
                    <button id="saveBtn">💾 存檔選單</button>
                </div>
                <div>
                    <p>© 2026 Lin Rui-An 林芮安 本作品內容僅供求職及學習展示使用，未經授權禁止商業使用或轉載。</p>
                </div>
            </div>
        </div>

        <!-- 💾 存檔視窗 -->
        <div id="saveModal" class="save-modal hidden">
            <div class="save-panel">

                <button id="closeSaveModal" class="close-btn">✕</button>

                <h3>存檔系統</h3>

                <div id="saveSlots"></div>

            </div>
        </div>

        <!-- BGM / SE 音源 -->
        <audio id="bgmSurface" src="./audio/surface.mp3" loop></audio>
        <audio id="bgmInner" src="./audio/inner.mp3" loop></audio>
        <audio id="bgmSuspense" src="./audio/suspense.mp3" loop></audio>
        <audio id="bgmred" src="./audio/red.mp3" loop></audio>

        <audio id="seghost" src="./audio/ghost.mp3"></audio>
        <audio id="sepage" src="./audio/page.mp3"></audio>
        <audio id="seattack01" src="./audio/attack01.mp3"></audio>
        <audio id="seattack02" src="./audio/attack02.mp3"></audio>
        <audio id="seghost01" src="./audio/ghost01.mp3"></audio>
        <audio id="sefoot" src="./audio/foot.mp3"></audio>
        <audio id="senightmarket" src="./audio/nightmarket.mp3"></audio>

        <script type="module" src="./engine.js"></script>
</body>
</html>
